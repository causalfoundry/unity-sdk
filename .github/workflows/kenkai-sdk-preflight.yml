name: Kenkai SDK preflight

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-structure:
    name: Package structure and Android facade
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate UPM package
        run: python3 Tools~/validate_package.py

      - name: Verify Android facade AAR
        run: sh Runtime/Plugins/Android/Native~/verify.sh

      - name: Inspect registry archive contents
        run: npm pack --dry-run

  ios-native-compile:
    name: iOS Core and Unity bridge compile
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate bundled Core package manifest
        working-directory: Runtime/Plugins/iOS/Native~/KenkaiCore
        run: swift package dump-package

      - name: Compile bundled Core for iOS Simulator
        working-directory: Runtime/Plugins/iOS/Native~/KenkaiCore
        run: |
          xcodebuild \
            -scheme KenkaiSDKCorePackage \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/kenkai-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            build

      - name: Type-check Unity Swift bridge
        working-directory: Runtime/Plugins/iOS/Native~
        run: |
          xcrun --sdk iphonesimulator swiftc \
            -typecheck \
            -target arm64-apple-ios13.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -I "$RUNNER_TEMP/kenkai-ios-derived/Build/Products/Debug-iphonesimulator" \
            -F "$RUNNER_TEMP/kenkai-ios-derived/Build/Products/Debug-iphonesimulator" \
            -module-cache-path "$RUNNER_TEMP/kenkai-ios-derived/BridgeModuleCache" \
            CausalFoundryUnityBridge.swift
